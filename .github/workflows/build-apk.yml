name: Build Android APK & Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release'
        required: false
        default: true
        type: boolean
      tag_name:
        description: 'Custom tag name (e.g. v1.13-1.0, leave empty for auto)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Determine Version
        id: version_step
        run: |
          # 1. Check custom tag from workflow_dispatch
          CUSTOM_TAG="${{ github.event.inputs.tag_name }}"
          
          # 2. Extract the checked-in versionName fallback from build.gradle.kts.
          # Greedy sed takes the LAST quoted string on the line, which is the
          # literal the Gradle expression falls back to when -P is absent.
          GRADLE_VERSION=$(grep -E '^\s*versionName\s*=\s*' src/android/app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d '[:space:]')
          if [ -z "$GRADLE_VERSION" ]; then
            echo "::error::Could not read versionName from src/android/app/build.gradle.kts"
            exit 1
          fi
          
          if [ -n "$CUSTOM_TAG" ]; then
            TAG_NAME="$CUSTOM_TAG"
            VERSION="${CUSTOM_TAG#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${GITHUB_REF_NAME#v}"
          else
            TAG_NAME="v${GRADLE_VERSION}"
            VERSION="${GRADLE_VERSION}"
          fi
          
          RELEASE_TITLE="OpenMinis v${VERSION}"
          echo "Detected Version: $VERSION"
          echo "Tag Name: $TAG_NAME"
          echo "Release Title: $RELEASE_TITLE"
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for scripts & gradlew
        run: |
          chmod +x src/android/gradlew
          chmod +x scripts/*.sh

      - name: Verify Android native libraries
        run: |
          if [ ! -f "src/android/app/libs/rclone.aar" ]; then
            echo "::error::src/android/app/libs/rclone.aar is missing!"
            exit 1
          fi
          echo "Found rclone.aar: $(ls -lh src/android/app/libs/rclone.aar)"

      - name: Verify and ensure Alpine rootfs asset
        run: |
          ROOTFS_PATH="src/android/app/src/main/assets/alpine-minirootfs.tar.gz"
          if [ ! -f "$ROOTFS_PATH" ]; then
            echo "alpine-minirootfs.tar.gz not found, downloading..."
            mkdir -p "src/android/app/src/main/assets"
            curl -fSL -o "$ROOTFS_PATH" "https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.3-aarch64.tar.gz"
          fi
          echo "Found Alpine rootfs: $(ls -lh $ROOTFS_PATH)"
      - name: Build Android APK (Release & Debug)
        run: |
          cd src/android
          # [T-version-single-source] Stamp the resolved tag version into the
          # APK so `versionName` inside the artifact always equals the release
          # tag (see app/build.gradle.kts). Without this the v1.13-1.1 release
          # shipped an APK still reporting 1.13-1.0.
          ./gradlew :app:assembleRelease :app:assembleDebug --no-daemon \
            -Pminis.versionName="${{ steps.version_step.outputs.version }}" \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      - name: Prepare and rename APK artifacts
        run: |
          VERSION="${{ steps.version_step.outputs.version }}"
          RELEASE_DIR="src/android/app/build/outputs/apk/release"
          DEBUG_DIR="src/android/app/build/outputs/apk/debug"
          
          mkdir -p dist
          if [ -f "$RELEASE_DIR/app-release.apk" ]; then
            cp "$RELEASE_DIR/app-release.apk" "dist/OpenMinis-${VERSION}-release.apk"
          fi
          if [ -f "$DEBUG_DIR/app-debug.apk" ]; then
            cp "$DEBUG_DIR/app-debug.apk" "dist/OpenMinis-${VERSION}-debug.apk"
          fi
          
          ls -lh dist/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-${{ steps.version_step.outputs.version }}-apks
          path: dist/*.apk

      - name: Create GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag_name }}
          name: ${{ steps.version_step.outputs.release_title }}
          body: |
            ## OpenMinis v${{ steps.version_step.outputs.version }}

            ### Fixes in this release:
            - **Image viewer drag follows the finger when zoomed**: the pan delta reported inside the image layer is in pre-scale local pixels while the layer `translationX/Y` is in screen pixels, so a magnified image used to move at 1/scale of the finger speed (a 300 px swipe moved it 110 px at 2.5x). Both viewers now share one zoom/pan state and compensate by the current scale.
            - **Swiping between images works again**: the framework transform detector consumed every sample past touch slop, which blocked the gallery pager — a fitted image could not be swiped to the next one at all. The viewer now only claims a gesture for magnified panning or a two-finger pinch.
            - **SOUL.md is listed again under Settings → Memory**: the daily-log-only whitelist introduced in v1.13-1.1 hid SOUL.md from the memory list even though the file was untouched on disk. The list now shows GLOBAL.md, SOUL.md and the daily logs — and still never the system-prompt files.
            - **GLOBAL.md / SOUL.md can no longer be lost to a bad save**: memory reads distinguish "empty" from "unreadable", the editor disables Save when the file could not be read, and both files are written atomically (tmp + rename). Neither can be deleted from the memory list.
            - **Version numbers can no longer drift**: the APK's embedded `versionName` is stamped from the release tag at build time (v1.13-1.1 shipped an APK that still reported `1.13-1.0`).

            ### Also included:
            - **Max Thinking Depth ULTRA**: reasoning depth up to ULTRA across providers.
            - **Alpine Linux Rootfs Self-Healing**: bundled rootfs asset and runtime multi-mirror download fallback.
            - **Channel Affix Stripping & Multimodal Detection**: recognise core model IDs (e.g. `gemini-3.8-flash-high`, `gemini-pro-agent`) for vision/image input and deep thinking.
            - **AI Task Management**: agent tools (`todo`, `task`, `goal`) with session file persistence, plus a collapsible Todo/Task card.
            - **System Prompt Management**: `SYSTEM.md` / `APPEND_SYSTEM.md` isolated under `minis-global/prompts/` with a permanent entry in main Settings.
            - **SSH Server Management**, **UI sheet fixes** and complete Chinese localization.

            ### Download APK:
            - `OpenMinis-${{ steps.version_step.outputs.version }}-release.apk`: Production release APK
            - `OpenMinis-${{ steps.version_step.outputs.version }}-debug.apk`: Debug APK with debugging server enabled
          files: |
            dist/OpenMinis-*-release.apk
            dist/OpenMinis-*-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
